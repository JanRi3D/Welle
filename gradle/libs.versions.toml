[versions]
agp = "9.3.3"
junit = "4.13.2"
# TLS provider for Android 4.x. 2.5.3 is the last release with minSdk 9 (2.7.0 needs 21);
# Java 7 bytecode; ships armeabi-v7a, arm64-v8a, x86 and x86_64 libraries.
conscrypt = "2.5.3"
# org.json is part of the platform at runtime; host-side unit tests need a real implementation.
json = "20240303"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
conscrypt = { group = "org.conscrypt", name = "conscrypt-android", version.ref = "conscrypt" }
json = { group = "org.json", name = "json", version.ref = "json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
